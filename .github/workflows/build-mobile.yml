name: Build QUDRA Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -q qudra.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build QUDRA Mobile APK
        working-directory: source/android-mobile
        run: gradle --no-daemon assembleDebug -PqudraApiBaseUrl=https://qudra.polsia.io

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUDRA-Mobile-debug-APK
          path: source/android-mobile/app/build/outputs/apk/debug/app-debug.apk
